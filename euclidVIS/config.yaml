# Euclid VIS Generation Configuration

paths:
  tng_path: "/virgotng/universe/IllustrisTNG/TNG50-1/output"
  grid_dir: "/u/mhuertas/data/synthesizer"
  output_path: "/u/mhuertas/data/euclid/tngmocks"
  filter_file: "Euclid_VIS.vis.dat" # Looked for in grid_dir
  euclid_subdir: "Euclid_fixed"
  desi_subdir: "DESI_fixed"

simulation:
  snap_number: 99
  stellar_mass_limit: 1e11 # 10^9.5 Msun
  max_stellar_mass: 1e12 # 10^11 Msun
  batch: true # Process all galaxies above limit if true
  max_galaxies: null # Set to a small number for debugging, null for full snapshot
  subhalo_ids: [0] # Used if batch is false or specific IDs are needed
  grid_name: "bc03-2016-Miles_chabrier-0.1,100_cloudy-c23.01-sps"

observation:
  z_obs: null # If null, use galaxy redshift. If < 0.001, defaults to 0.05
  randomize_redshift: true # Assignment random redshift between z_min and z_max
  z_min: 0.0
  z_max: 1.5
  fov_kpc: 50.0
  pixel_scale_arcsec: 0.1
  fwhm_arcsec: 0.16 # PSF FWHM

model:
  kappa: 20.0
  dust_to_metal: 0.4
  dust_curve: "Calzetti2000"
  vel_shift: true # Apply particle line-of-sight Doppler shifts to spectra

optimization:
  particle_limit: -1 # Set to null or -1 to disable limit (use all particles)
  chunk_size: 2500 # Safe memory limit per worker
  nthreads_spectra: 8 # 9 workers * 8 threads = 72 cores
  nthreads_tau_v: 8 # Match spectra threads
  n_jobs: 9 # Conservative parallel count to guarantee no OOM (9 * 5GB << 240GB)

desi:
  enabled: true
  fiber_diameter_arcsec: 1.5
  noise_model: "feasibgs"
  exposure_time_seconds: 180.0
  airmass: 1.1
  seeing_arcsec: 1.1
  sky_model: "bright"
  moon_illumination: 0.7
  moon_altitude_deg: 60.0
  moon_separation_deg: 80.0
  sun_altitude_deg: -30.0
  sun_separation_deg: 180.0
  sky_subtraction_error: 0.0
  output_dlambda_angstrom: 0.8
  noise_seed: 42
  output_name: "desi_spectrum.fits"
  lam_min: 3600.0
  lam_max: 9800.0
  d_lam: 0.1
  R_min: 2000.0
  R_max: 5000.0

projection:
  type: "random" # "random", "face-on", "edge-on", or "manual"
  phi: 0.0
  theta: 0.0
