# Euclid deep-field matched TNG50 mock sample

paths:
  tng_path: "/virgotng/universe/IllustrisTNG/TNG50-1/output"
  grid_dir: "/u/mhuertas/data/synthesizer"
  output_path: "/u/mhuertas/data/euclid/tngmocks_matched"
  reference_catalog: "/u/mhuertas/data/euclid/reference/physical_properties_deep.fits"
  filter_file: "Euclid_VIS.vis.dat"
  euclid_subdir: "Euclid_raw_and_psf"
  desi_subdir: "DESI"

sample:
  n_mocks: 100
  seed: 42
  z_min: 0.0
  z_max: 2.0
  log_mass_min: 9.5
  log_mass_max: 13.0
  redshift_bin_width: 0.02
  mass_bin_width: 0.05
  snapshot_min: 0
  snapshot_max: 99
  selection_manifest: "matched_sample.csv"

simulation:
  grid_name: "bc03-2016-Miles_chabrier-0.1,100_cloudy-c23.01-sps"

observation:
  fov_kpc: 50.0
  pixel_scale_arcsec: 0.1
  fwhm_arcsec: 0.16

model:
  kappa: 20.0
  dust_to_metal: 0.4
  dust_curve: "Calzetti2000"
  vel_shift: false

optimization:
  particle_limit: -1
  chunk_size: 2500
  nthreads_spectra: 8
  nthreads_tau_v: 8
  n_jobs: 9
  force_overwrite: false

desi:
  enabled: true
  fiber_diameter_arcsec: 1.5
  lam_min: 3600.0
  lam_max: 9800.0
  d_lam: 0.1
  R_min: 2000.0
  R_max: 5000.0

projection:
  type: "random"
  phi: 0.0
  theta: 0.0
